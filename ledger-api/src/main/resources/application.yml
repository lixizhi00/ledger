app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET:ledger-default-secret-key-at-least-32-bytes-long}
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}

spring:
  application:
    name: ledger-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
