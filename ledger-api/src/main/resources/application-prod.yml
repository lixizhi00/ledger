app:
  cors:
    # 生产环境建议通过 APP_CORS_ALLOWED_ORIGINS 环境变量配置具体前端域名
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGINS:*}

spring:
  datasource:
    # useSSL/allowPublicKeyRetrieval 可通过环境变量覆盖，生产建议 useSSL=true
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ledger}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    database-platform: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never
